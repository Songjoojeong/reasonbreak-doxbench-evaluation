[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoprivacy-eval"
version = "1.0.0"
description = "DoxBench evaluation extension for image geolocation privacy experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "pytesseract>=0.3.10",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
dev = ["pytest>=8.0"]

[project.scripts]
geoprivacy-eval = "geoprivacy_eval.pipeline:main"
geoprivacy-ocr = "geoprivacy_eval.ocr:main"
geoprivacy-prepare-doxbench = "geoprivacy_eval.dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
